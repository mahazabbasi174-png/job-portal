<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Jobs Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f6fa;color:#243247}
header{background:#102d50;color:white;padding:22px 7%;display:flex;justify-content:space-between;flex-wrap:wrap}
.logo{font-size:25px;font-weight:bold}
.logo span{color:#35d0a0}
nav a{color:white;margin:10px;text-decoration:none}
.hero{background:linear-gradient(120deg,#102d50,#176c91);color:white;text-align:center;padding:55px 15px}
.hero h1{font-size:36px}
.search{max-width:600px;margin:25px auto;display:flex;gap:8px}
input,textarea,select{padding:12px;border:1px solid #ddd;border-radius:6px;width:100%;margin:7px 0;font-size:15px}
.search input{background:white}
button{background:#087cbd;color:white;border:0;padding:12px 18px;border-radius:6px;cursor:pointer;margin:5px}
button:hover{opacity:.85}
.container{max-width:1050px;margin:30px auto;padding:15px}
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.job,.panel{background:white;padding:20px;border-radius:10px;box-shadow:0 2px 12px #0001}
.job h3{color:#087cbd}
.panel{max-width:650px;margin:30px auto}
.hidden{display:none}
footer{text-align:center;padding:25px;background:#102d50;color:white;margin-top:40px}
</style>
</head>
<body>

<header>
<div class="logo">Career <span>Jobs Hub</span></div>
<nav>
<a href="#home">Home</a>
<a href="#jobs">Find Jobs</a>
<a href="#admin">Admin</a>
</nav>
</header>

<section class="hero" id="home">
<h1>Find Your Dream Job</h1>
<p>Explore the latest jobs and opportunities around the world.</p>
<div class="search">
<input id="search" placeholder="Search jobs or location">
<button onclick="loadJobs()">Search</button>
</div>
</section>

<section class="container" id="jobs">
<h2>Latest Jobs</h2>
<div class="jobs" id="jobList">Loading jobs...</div>
</section>

<section class="container" id="admin">
<div class="panel" id="loginBox">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMessage"></p>
</div>

<div class="panel hidden" id="adminBox">
<h2>Admin Dashboard</h2>
<button onclick="logout()">Logout</button>
<h3>Add / Edit Job</h3>
<input id="jobId" type="hidden">
<input id="title" placeholder="Job Title">
<input id="company" placeholder="Company Name">
<input id="location" placeholder="Location">
<input id="salary" placeholder="Salary">
<select id="jobType">
<option value="Full Time">Full Time</option>
<option value="Part Time">Part Time</option>
<option value="Remote">Remote</option>
<option value="Contract">Contract</option>
</select>
<textarea id="description" placeholder="Job Description"></textarea>
<input id="applyLink" placeholder="Apply Link">
<button onclick="saveJob()">Save Job</button>
<p id="adminMessage"></p>
<h3>Manage Jobs</h3>
<div id="manageJobs"></div>
</div>
</section>

<footer>© 2026 Career Jobs Hub. All Rights Reserved.</footer>

<script>
const SUPABASE_URL = "https://kcwkofhkclaxwljuwudd.supabase.co";
const SUPABASE_KEY = "sb_publishable_EIaabpjxJ8eImi9UNd-Tzw_LdP31wPH";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;

function safe(value){
 return String(value || "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

async function loadJobs(){
 const term=document.getElementById("search").value.trim();
 let query=db.from("jobs").select("*").order("created_at",{ascending:false});
 if(term){
  query=query.or("title.ilike.%"+term+"%,company.ilike.%"+term+"%,location.ilike.%"+term+"%");
 }
 const {data,error}=await query;
 const list=document.getElementById("jobList");
 if(error){list.textContent="Could not load jobs. Please try again.";return;}
 if(!data || data.length===0){list.textContent="No jobs found.";return;}
 list.innerHTML=data.map(j=>`
 <div class="job">
 <h3>${safe(j.title)}</h3>
 <p><b>Company:</b> ${safe(j.company)}</p>
 <p><b>Location:</b> ${safe(j.location)}</p>
 <p><b>Salary:</b> ${safe(j.salary)}</p>
 <p><b>Type:</b> ${safe(j.job_type)}</p>
 <p>${safe(j.description)}</p>
 ${j.apply_link?`<a href="${safe(j.apply_link)}" target="_blank" rel="noopener"><button>Apply Now</button></a>`:""}
 </div>`).join("");
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("loginMessage");
 msg.textContent="Logging in...";
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){msg.textContent=error.message;return;}
 currentUser=data.user;
 showAdmin();
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 document.getElementById("adminBox").classList.add("hidden");
 document.getElementById("loginBox").classList.remove("hidden");
}

function showAdmin(){
 document.getElementById("loginBox").classList.add("hidden");
 document.getElementById("adminBox").classList.remove("hidden");
 loadManageJobs();
}

async function saveJob(){
 if(!currentUser){return;}
 const id=document.getElementById("jobId").value;
 const job={
 title:document.getElementById("title").value.trim(),
 company:document.getElementById("company").value.trim(),
 location:document.getElementById("location").value.trim(),
 salary:document.getElementById("salary").value.trim(),
 job_type:document.getElementById("jobType").value,
 description:document.getElementById("description").value.trim(),
 apply_link:document.getElementById("applyLink").value.trim()
 };
 const msg=document.getElementById("adminMessage");
 if(!job.title || !job.company){msg.textContent="Job title and company are required.";return;}
 let result;
 if(id){
  result=await db.from("jobs").update(job).eq("id",id);
 }else{
  result=await db.from("jobs").insert(job);
 }
 if(result.error){msg.textContent=result.error.message;return;}
 msg.textContent="Job saved successfully!";
 clearForm();
 loadJobs();
 loadManageJobs();
}

async function loadManageJobs(){
 const {data,error}=await db.from("jobs").select("*").order("created_at",{ascending:false});
 const box=document.getElementById("manageJobs");
 if(error){box.textContent=error.message;return;}
 if(!data || data.length===0){box.textContent="No jobs added yet.";return;}
 box.innerHTML=data.map(j=>`
 <div class="job">
 <b>${safe(j.title)}</b> - ${safe(j.company)}
 <button onclick="editJob(${j.id})">Edit</button>
 <button onclick="deleteJob(${j.id})">Delete</button>
 </div>`).join("");
}

async function editJob(id){
 const {data,error}=await db.from("jobs").select("*").eq("id",id).single();
 if(error){alert(error.message);return;}
 document.getElementById("jobId").value=data.id;
 document.getElementById("title").value=data.title || "";
 document.getElementById("company").value=data.company || "";
 document.getElementById("location").value=data.location || "";
 document.getElementById("salary").value=data.salary || "";
 document.getElementById("jobType").value=data.job_type || "Full Time";
 document.getElementById("description").value=data.description || "";
 document.getElementById("applyLink").value=data.apply_link || "";
 window.scrollTo(0,document.getElementById("admin").offsetTop);
}

async function deleteJob(id){
 if(!confirm("Are you sure you want to delete this job?"))return;
 const {error}=await db.from("jobs").delete().eq("id",id);
 if(error){alert(error.message);return;}
 loadJobs();
 loadManageJobs();
}

function clearForm(){
 ["jobId","title","company","location","salary","description","applyLink"].forEach(id=>{
 document.getElementById(id).value="";
 });
}

async function checkSession(){
 const {data}=await db.auth.getSession();
 if(data.session){
  currentUser=data.session.user;
  showAdmin();
 }
}

loadJobs();
checkSession();
</script>
</body>
</html>
